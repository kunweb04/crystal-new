<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AdSense 14天波动监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #4285f4; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; width: 100%; max-width: 900px; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2 { text-align: center; color: #3c4043; }
        .btn-group { text-align: center; margin: 20px 0; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        #signout_btn { background: #ea4335; display: none; margin-left: 10px; }
        .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; display: none; }
        .metric-box { background: #f1f3f4; padding: 15px; border-radius: 10px; text-align: center; }
        .metric-label { font-size: 12px; color: #5f6368; }
        .metric-value { font-size: 18px; font-weight: bold; color: #1a73e8; margin-top: 5px; }
        .chart-container { width: 100%; height: 400px; display: none; }
        #status { font-size: 14px; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>AdSense 数据波动看板 (14天)</h2>
    
    <div class="btn-group">
        <button id="auth_btn" onclick="handleAuthClick()">授权并加载数据</button>
        <button id="signout_btn" onclick="handleSignoutClick()">退出登录</button>
    </div>

    <div id="status">等待授权...</div>

    <div class="summary-grid" id="summary">
        <div class="metric-box"><div class="metric-label">昨日 PV</div><div id="pv_y" class="metric-value">0</div></div>
        <div class="metric-box"><div class="metric-label">昨日收益</div><div id="earn_y" class="metric-value">$0.00</div></div>
        <div class="metric-box"><div class="metric-label">昨日展示</div><div id="imp_y" class="metric-value">0</div></div>
        <div class="metric-box"><div class="metric-label">昨日点击</div><div id="click_y" class="metric-value">0</div></div>
    </div>

    <div class="chart-container" id="chart_wrap">
        <canvas id="trendChart"></canvas>
    </div>
</div>

<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

<script>
    const CLIENT_ID = '297716650690-dul6b3lt177j8meub9ng8d6b2tcant6g.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/adsense.readonly';
    const DISCOVERY_DOC = 'https://adsense.googleapis.com/$discovery/rest?version=v2';

    let tokenClient, trendChart;
    let gapiInited = false, gsiInited = false;

    function gapiLoaded() {
        gapi.load('client', async () => {
            await gapi.client.init({ discoveryDocs: [DISCOVERY_DOC] });
            gapiInited = true;
            checkInited();
        });
    }

    function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback: '' });
        gsiInited = true;
        checkInited();
    }

    function checkInited() {
        if (gapiInited && gsiInited) document.getElementById('status').innerText = '就绪';
    }

    function handleAuthClick() {
        tokenClient.callback = async (resp) => {
            if (resp.error) throw resp;
            document.getElementById('auth_btn').style.display = 'none';
            document.getElementById('signout_btn').style.display = 'inline-block';
            document.getElementById('summary').style.display = 'grid';
            document.getElementById('chart_wrap').style.display = 'block';
            await refreshData();
        };
        tokenClient.requestAccessToken(gapi.client.getToken() ? {prompt: ''} : {prompt: 'consent'});
    }

    async function refreshData() {
        try {
            document.getElementById('status').innerText = '获取 14 天数据中...';
            const accounts = await gapi.client.adsense.accounts.list();
            const accountId = accounts.result.accounts[0].name;
            
            // 请求过去14天的数据，并按 DATE 维度拆分
            const response = await gapi.client.adsense.accounts.reports.generate({
                account: accountId,
                dateRange: 'LAST_14_DAYS',
                metrics: ['PAGE_VIEWS', 'ESTIMATED_EARNINGS', 'IMPRESSIONS', 'CLICKS'],
                dimensions: ['DATE']
            });

            const rows = response.result.rows;
            const totals = response.result.totals.cells;

            // 1. 更新昨日数据（通常是列表的最后一项或倒数第二项，取决于时差）
            const yesterdayData = rows[rows.length - 1].cells;
            document.getElementById('pv_y').innerText = yesterdayData[1].value;
            document.getElementById('earn_y').innerText = '$' + yesterdayData[2].value;
            document.getElementById('imp_y').innerText = yesterdayData[3].value;
            document.getElementById('click_y').innerText = yesterdayData[4].value;

            // 2. 准备图表数据
            const labels = rows.map(r => r.cells[0].value); // 日期
            const pvData = rows.map(r => parseInt(r.cells[1].value));
            const earnData = rows.map(r => parseFloat(r.cells[2].value));

            renderChart(labels, pvData, earnData);
            document.getElementById('status').innerText = '数据更新成功';
        } catch (err) {
            document.getElementById('status').innerText = '错误: ' + err.result.error.message;
        }
    }

    function renderChart(labels, pvData, earnData) {
        const ctx = document.getElementById('trendChart').getContext('2d');
        if (trendChart) trendChart.destroy();
        
        trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: '页面浏览量 (PV)',
                        data: pvData,
                        borderColor: '#4285f4',
                        yAxisID: 'y',
                        tension: 0.3
                    },
                    {
                        label: '预估收益 (USD)',
                        data: earnData,
                        borderColor: '#34a853',
                        yAxisID: 'y1',
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { type: 'linear', position: 'left', title: {display: true, text: 'PV'} },
                    y1: { type: 'linear', position: 'right', title: {display: true, text: '收益'}, grid: {drawOnChartArea: false} }
                }
            }
        });
    }

    function handleSignoutClick() {
        const token = gapi.client.getToken();
        if (token) {
            google.accounts.oauth2.revoke(token.access_token);
            gapi.client.setToken('');
            location.reload();
        }
    }
</script>
</body>
</html>
