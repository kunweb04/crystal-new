<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果 - CrystalLab</title>
    <meta name="description" content="在 CrystalLab 中搜索晶体培养相关内容">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="content.css">
    <link rel="icon" href="favicon.ico" type="image/png">
    <style>
        .search-results-container {
            max-width: 1200px;
            margin: 100px auto 60px;
            padding: 0 20px;
        }
        
        .search-results-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .search-results-header h1 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
            font-family: 'Playfair Display', serif;
        }
        
        .search-query {
            color: var(--accent);
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .search-results-container {
                margin-top: 80px;
                padding: 0 15px;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    
    <div class="search-results-container">
        <div class="search-results-header">
            <h1><i class="fas fa-search"></i> 搜索结果</h1>
            <p>为您找到关于 <span class="search-query" id="searchQuery">晶体</span> 的相关内容</p>
        </div>
        
        <!-- Google 自定义搜索结果容器 -->
        <div class="gcse-searchresults"></div>
        
        <!-- 无结果时显示 -->
        <div id="noResults" style="display:none; text-align:center; padding: 40px;">
            <i class="fas fa-search" style="font-size:3rem; color:var(--accent); margin-bottom:20px; opacity:0.5;"></i>
            <h3>未找到相关结果</h3>
            <p>请尝试其他关键词，或浏览以下热门内容：</p>
            <div style="margin-top:30px;">
                <a href="crystal-classification.html" style="background:var(--light-gray); color:var(--primary); padding:10px 20px; border-radius:25px; text-decoration:none; margin:5px; display:inline-block;">晶体分类</a>
                <a href="copper-sulfate.html" style="background:var(--light-gray); color:var(--primary); padding:10px 20px; border-radius:25px; text-decoration:none; margin:5px; display:inline-block;">硫酸铜</a>
                <a href="aluminum-potassium-sulfate.html" style="background:var(--light-gray); color:var(--primary); padding:10px 20px; border-radius:25px; text-decoration:none; margin:5px; display:inline-block;">硫酸铝钾</a>
                <a href="safety.html" style="background:var(--light-gray); color:var(--primary); padding:10px 20px; border-radius:25px; text-decoration:none; margin:5px; display:inline-block;">安全指南</a>
                <a href="portfolio.html" style="background:var(--light-gray); color:var(--primary); padding:10px 20px; border-radius:25px; text-decoration:none; margin:5px; display:inline-block;">作品展示</a>
            </div>
        </div>
    </div>
    
    <div id="footer-container"></div>
    
    <script src="components.js"></script>
    <script>
        // 获取URL中的搜索查询参数
        function getQueryParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const query = getQueryParameter('q');
            const searchQueryElement = document.getElementById('searchQuery');
            
            if (query) {
                const decodedQuery = decodeURIComponent(query);
                searchQueryElement.textContent = decodedQuery;
                document.title = `"${decodedQuery}" 搜索结果 - CrystalLab`;
            } else {
                // 如果没有搜索词，重定向到首页
                window.location.href = 'index.html';
            }
            
            // 设置Google CSE配置
            window.__gcse = {
                parsetags: 'explicit',
                initializationCallback: function() {
                    google.search.cse.element.render({
                        div: 'gcse-searchresults',
                        tag: 'searchresults-only'
                    });
                    
                    // 检查结果是否为空
                    setTimeout(function() {
                        const results = document.querySelector('.gsc-results');
                        if (!results || results.innerHTML.trim() === '') {
                            document.getElementById('noResults').style.display = 'block';
                        }
                    }, 2000);
                }
            };
            
            // 加载Google CSE脚本
            const script = document.createElement('script');
            script.async = true;
            script.src = 'https://cse.google.com/cse.js?cx=20995defc55444858';
            document.head.appendChild(script);
        });
    </script>
</body>
</html>
