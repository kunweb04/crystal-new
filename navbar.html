            <!-- Google自定义搜索容器 -->
            <div id="google-custom-search">
                <div class="gcse-searchbox-only" 
                     data-resultsUrl="search-results.html" 
                     data-newWindow="false" 
                     data-queryParameterName="q"
                     data-autoCompleteMaxCompletions="5"></div>
            </div>
        </div>

<style>
/* 搜索框加载时的临时样式 */
.search-box {
    position: relative;
}

.search-box .loading-text {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255, 255, 255, 0.85);
    font-weight: 300;
    font-size: 1.05rem;
    pointer-events: none;
    z-index: 1;
}

.search-box.loaded .loading-text {
    display: none;
}
</style>

<script>
// 页面加载完成后初始化Google搜索
document.addEventListener('DOMContentLoaded', function() {
    // 创建Google CSE配置
    window.__gcse = {
        parsetags: 'explicit',
        initializationCallback: function() {
            if (typeof google !== 'undefined' && google.search && google.search.cse) {
                // 渲染搜索框
                google.search.cse.element.render({
                    div: 'google-custom-search',
                    tag: 'searchbox-only',
                    attributes: {
                        resultsUrl: 'search-results.html',
                        newWindow: false,
                        queryParameterName: 'q',
                        autoCompleteMaxCompletions: 5
                    }
                });
                
                // 移除Google默认的placeholder
                setTimeout(function() {
                    const googleInput = document.querySelector('.gsc-input');
                    if (googleInput) {
                        // 清除Google的默认placeholder
                        googleInput.placeholder = '';
                        
                        // 添加一个透明字符作为占位，避免浏览器显示默认placeholder
                        googleInput.placeholder = '\u00A0';
                    }
                    
                    // 标记搜索框已加载
                    document.querySelector('.search-box').classList.add('loaded');
                }, 1000);
            }
        }
    };
    
    // 加载Google CSE脚本
    const existingScript = document.querySelector('script[src*="cse.google.com/cse.js"]');
    if (!existingScript) {
        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://cse.google.com/cse.js?cx=20995defc55444858';
        document.body.appendChild(script);
    }
});
</script>
