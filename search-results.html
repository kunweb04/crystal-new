<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果 - CrystalLab</title>
    <meta name="description" content="在 CrystalLab 中搜索晶体培养相关内容">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="content.css">
    <link rel="icon" href="favicon.ico" type="image/png">
    <style>
        .search-results-container {
            max-width: 1200px;
            margin: 100px auto 60px;
            padding: 0 20px;
        }
        
        .search-results-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 2rem;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        
        .search-results-header h1 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
            font-family: 'Playfair Display', serif;
        }
        
        .search-query {
            color: var(--accent);
            font-weight: 600;
            font-size: 1.2rem;
            padding: 0.5rem 1.5rem;
            background: rgba(26, 188, 156, 0.1);
            border-radius: 30px;
            display: inline-block;
            margin: 0 10px;
        }
        
        .search-stats {
            color: var(--text-light);
            margin-top: 1rem;
            font-size: 1.1rem;
        }
        
        .gcse-searchresults {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            min-height: 400px;
            margin-bottom: 40px;
        }
        
        .gsc-control-cse {
            padding: 0 !important;
            margin: 0 !important;
            border: none !important;
            background: transparent !important;
            font-family: 'Noto Sans SC', sans-serif !important;
        }
        
        .gsc-webResult.gsc-result {
            border-bottom: 2px solid var(--border-color) !important;
            padding: 25px 0 !important;
            margin: 0 !important;
        }
        
        .gsc-webResult.gsc-result:hover {
            background-color: rgba(26, 188, 156, 0.03) !important;
        }
        
        .gs-result .gs-title {
            color: var(--primary) !important;
            font-size: 1.3rem !important;
            font-weight: 600 !important;
            text-decoration: none !important;
            line-height: 1.4 !important;
            margin-bottom: 8px !important;
        }
        
        .gs-result .gs-title b {
            color: var(--accent) !important;
        }
        
        .gs-result .gs-title:hover {
            color: var(--accent) !important;
            text-decoration: underline !important;
        }
        
        .gsc-url-top, .gsc-url-bottom {
            color: var(--accent) !important;
            font-size: 0.9rem !important;
            margin-bottom: 8px !important;
        }
        
        .gs-snippet {
            color: var(--text) !important;
            line-height: 1.7 !important;
            font-size: 1.05rem !important;
            margin: 10px 0 !important;
        }
        
        .gs-snippet b {
            color: var(--accent) !important;
            font-weight: 600 !important;
        }
        
        .gsc-table-result {
            margin-bottom: 20px !important;
        }
        
        .gsc-cursor-box {
            margin-top: 40px !important;
            text-align: center !important;
        }
        
        .gsc-cursor {
            display: flex !important;
            justify-content: center !important;
            gap: 10px !important;
        }
        
        .gsc-cursor-page {
            background: white !important;
            border: 2px solid var(--border-color) !important;
            color: var(--primary) !important;
            padding: 10px 18px !important;
            border-radius: 10px !important;
            text-decoration: none !important;
            font-weight: 500 !important;
            transition: var(--transition) !important;
        }
        
        .gsc-cursor-current-page {
            background: var(--accent) !important;
            color: white !important;
            border-color: var(--accent) !important;
        }
        
        .gsc-cursor-page:hover {
            background: var(--accent) !important;
            color: white !important;
            border-color: var(--accent) !important;
            transform: translateY(-3px) !important;
            box-shadow: 0 8px 20px rgba(26, 188, 156, 0.3) !important;
        }

        .no-results-container {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            margin: 40px 0;
        }
        
        .no-results-icon {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 20px;
            opacity: 0.6;
        }
        
        .no-results-title {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .no-results-description {
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto 30px;
            line-height: 1.7;
        }
        
        .search-suggestions {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        
        .search-suggestion {
            background: var(--light-gray);
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            transition: var(--transition);
            font-weight: 500;
        }
        
        .search-suggestion:hover {
            background: var(--accent);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(26, 188, 156, 0.3);
        }
        
        .related-searches {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-top: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        
        .related-searches h3 {
            color: var(--primary);
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .related-search-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .related-search-item {
            background: var(--light-gray);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            transition: var(--transition);
        }
        
        .related-search-item:hover {
            background: var(--accent);
            color: white;
        }
        
        @media (max-width: 768px) {
            .search-results-container {
                margin-top: 80px;
                padding: 0 15px;
            }
            
            .search-results-header h1 {
                font-size: 2rem;
            }
            
            .gcse-searchresults {
                padding: 20px;
            }
            
            .gs-result .gs-title {
                font-size: 1.2rem !important;
            }
            
            .search-suggestions {
                flex-direction: column;
                align-items: center;
            }
        }
        
        @media (max-width: 480px) {
            .search-results-header h1 {
                font-size: 1.8rem;
            }
            
            .gcse-searchresults {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    
    <div class="search-results-container">
        <div class="search-results-header">
            <h1><i class="fas fa-search"></i> 搜索结果</h1>
            <p>为您找到关于 <span class="search-query" id="searchQuery">晶体</span> 的相关内容</p>
            <p class="search-stats" id="searchStats">正在加载搜索结果...</p>
        </div>
        
        <div class="gcse-searchresults" data-gname="searchresults"></div>
        
        <div class="no-results-container" id="noResults" style="display:none;">
            <div class="no-results-icon">
                <i class="fas fa-search"></i>
            </div>
            <h3 class="no-results-title">未找到相关结果</h3>
            <p class="no-results-description">
                抱歉，没有找到与您的搜索词相关的内容。<br>
                请尝试使用其他关键词，或浏览以下热门内容。
            </p>
            <div class="search-suggestions">
                <a href="crystal-classification.html" class="search-suggestion">晶体分类</a>
                <a href="copper-sulfate.html" class="search-suggestion">硫酸铜</a>
                <a href="aluminum-potassium-sulfate.html" class="search-suggestion">硫酸铝钾</a>
                <a href="safety.html" class="search-suggestion">安全指南</a>
                <a href="portfolio.html" class="search-suggestion">作品展示</a>
                <a href="crystallization.html" class="search-suggestion">结晶方式</a>
                <a href="solutionpreparation.html" class="search-suggestion">溶液配置</a>
            </div>
        </div>
        
        <div class="related-searches" id="relatedSearches" style="display:none;">
            <h3><i class="fas fa-lightbulb"></i> 您可能还想搜索</h3>
            <div class="related-search-items">
            </div>
        </div>
    </div>
    
    <div id="footer-container"></div>
    
    <script src="components.js"></script>
    <script>
        // 获取URL中的搜索查询参数
        function getQueryParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        // 相关搜索词推荐
        const relatedKeywords = {
            "硫酸铜": ["硫酸铜晶体", "蓝矾", "晶体培养", "结晶", "化学晶体"],
            "明矾": ["硫酸铝钾", "白矾", "晶体制作", "入门晶体", "透明晶体"],
            "安全": ["实验安全", "化学品安全", "防护措施", "急救措施", "危险品"],
            "晶雨": ["红晶雨", "晶体悬浮液", "天气瓶", "钴配合物", "配位化合物"],
            "摄影": ["晶体摄影", "拍照技巧", "微距摄影", "灯光设置", "背景选择"],
            "保存": ["晶体保存", "防潮", "防氧化", "密封保存", "展示方法"],
            "配置": ["溶液配置", "饱和溶液", "溶解度", "温度控制", "过滤方法"]
        };
        
        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            const query = getQueryParameter('q');
            const searchQueryElement = document.getElementById('searchQuery');
            
            if (query) {
                const decodedQuery = decodeURIComponent(query);
                searchQueryElement.textContent = decodedQuery;
                
                // 更新页面标题
                document.title = `"${decodedQuery}" 搜索结果 - CrystalLab`;
                
                // 设置相关搜索
                setTimeout(setupRelatedSearches, 1000);
            } else {
                // 如果没有搜索词，重定向到首页
                window.location.href = 'index.html';
            }
            
            // 配置Google CSE
            window.__gcse = {
                parsetags: 'explicit',
                initializationCallback: function() {
                    // 渲染搜索结果
                    google.search.cse.element.render({
                        div: 'gcse-searchresults',
                        tag: 'searchresults-only',
                        attributes: {
                            enableOrderBy: true,
                            enableHistory: false
                        }
                    });
                    
                    // 监听搜索结果加载完成
                    google.search.cse.element.setOnLoadCallback(function(container) {
                        setTimeout(checkSearchResults, 1500);
                    });
                }
            };
            
            // 加载Google CSE脚本
            const script = document.createElement('script');
            script.async = true;
            script.src = 'https://cse.google.com/cse.js?cx=20995defc55444858';
            document.head.appendChild(script);
        });
        
        // 检查搜索结果
        function checkSearchResults() {
            const resultsContainer = document.querySelector('.gsc-results');
            const noResultsElement = document.getElementById('noResults');
            const searchStatsElement = document.getElementById('searchStats');
            
            if (resultsContainer && resultsContainer.innerHTML.trim() !== '') {
                // 有搜索结果
                noResultsElement.style.display = 'none';
                
                // 统计结果数量
                const resultCount = document.querySelectorAll('.gsc-webResult.gsc-result').length;
                if (resultCount > 0) {
                    searchStatsElement.textContent = `找到约 ${resultCount} 条相关结果`;
                }
            } else {
                // 无搜索结果
                noResultsElement.style.display = 'block';
                searchStatsElement.textContent = '未找到相关结果';
            }
        }
        
        // 设置相关搜索
        function setupRelatedSearches() {
            const query = getQueryParameter('q');
            if (!query) return;
            
            const decodedQuery = decodeURIComponent(query).toLowerCase();
            const relatedSearchesElement = document.getElementById('relatedSearches');
            const relatedSearchItems = document.querySelector('.related-search-items');
            
            // 清空之前的推荐
            relatedSearchItems.innerHTML = '';
            
            // 查找相关关键词
            let foundRelated = false;
            
            Object.keys(relatedKeywords).forEach(keyword => {
                if (decodedQuery.includes(keyword.toLowerCase())) {
                    foundRelated = true;
                    relatedKeywords[keyword].forEach(related => {
                        const searchItem = document.createElement('a');
                        searchItem.href = `search-results.html?q=${encodeURIComponent(related)}`;
                        searchItem.className = 'related-search-item';
                        searchItem.textContent = related;
                        relatedSearchItems.appendChild(searchItem);
                    });
                }
            });
            
            // 如果没有匹配的关键词，显示通用推荐
            if (!foundRelated) {
                const genericKeywords = [
                    '晶体培养', '硫酸铜', '明矾', '安全指南', 
                    '作品展示', '结晶方式', '溶液配置', '晶体保存'
                ];
                
                genericKeywords.forEach(keyword => {
                    const searchItem = document.createElement('a');
                    searchItem.href = `search-results.html?q=${encodeURIComponent(keyword)}`;
                    searchItem.className = 'related-search-item';
                    searchItem.textContent = keyword;
                    relatedSearchItems.appendChild(searchItem);
                });
            }
            
            // 显示相关搜索区域
            if (relatedSearchItems.children.length > 0) {
                relatedSearchesElement.style.display = 'block';
            }
        }
        
        // 自动聚焦搜索框（如果有）
        window.addEventListener('load', function() {
            setTimeout(function() {
                const searchInput = document.querySelector('.gsc-input');
                if (searchInput) {
                    searchInput.focus();
                }
            }, 500);
        });
    </script>
</body>
</html>
