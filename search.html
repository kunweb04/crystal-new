<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索 - CrystalLab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="content.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="section">
            <div class="section-title">
                <h2>搜索晶体相关内容</h2>
                <p>使用Google自定义搜索引擎，查找网站内的所有晶体相关文章</p>
            </div>
            
            <div class="search-page-content">
                <div class="search-form-container">
                    <form id="search-page-form" class="search-page-form">
                        <input type="text" 
                               id="search-page-input" 
                               placeholder="输入关键词搜索晶体相关内容..."
                               autocomplete="off"
                               required>
                        <button type="submit">
                            <i class="fas fa-search"></i> 搜索
                        </button>
                    </form>
                </div>
                
                <div class="google-cse-container">
                    <script async src="https://cse.google.com/cse.js?cx=20995defc55444858"></script>
                    <div class="gcse-searchresults-only" 
                         data-queryParameterName="q"
                         data-enableHistory="true"
                         data-sortBy="date"
                         data-filter="0"
                         data-gname="crystallabsearch">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchForm = document.getElementById('search-page-form');
            const searchInput = document.getElementById('search-page-input');
            
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            
            if (query) {
                searchInput.value = query;
                
                setTimeout(() => {
                    const gcseElement = document.querySelector('.gsc-input');
                    if (gcseElement) {
                        gcseElement.value = query;
                        const searchButton = document.querySelector('.gsc-search-button');
                        if (searchButton) {
                            searchButton.click();
                        }
                    }
                }, 1000);
            }
            
            searchForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const query = searchInput.value.trim();
                if (query) {
                    window.location.href = `search.html?q=${encodeURIComponent(query)}`;
                }
            });
        });
    </script>
</body>
</html>
