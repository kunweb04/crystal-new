            <div id="google-custom-search">
                <div class="search-placeholder">
                    <input type="text" placeholder="搜索相关内容..." disabled>
                    <button disabled><i class="fas fa-search"></i></button>
                </div>
            </div>
        </div>
    </div>
</header>

<script>
window.addEventListener('load', function() {
    // 创建配置
    window.__gcse = {
        parsetags: 'explicit',
        initializationCallback: function() {
            // 移除占位符
            const placeholder = document.querySelector('.search-placeholder');
            if (placeholder) {
                placeholder.style.display = 'none';
            }
            
            // 渲染搜索框
            if (typeof google !== 'undefined' && google.search && google.search.cse) {
                const searchBox = google.search.cse.element.render({
                    div: 'google-custom-search',
                    tag: 'searchbox-only',
                    attributes: {
                        resultsUrl: 'search-results.html',
                        newWindow: false,
                        queryParameterName: 'q',
                        autoCompleteMaxCompletions: 5
                    }
                });
                
                // 等待搜索框渲染完成
                setTimeout(function() {
                    // 添加自定义placeholder
                    const googleInput = document.querySelector('.gsc-input');
                    if (googleInput) {
                        googleInput.placeholder = '搜索相关内容...';
                    }
                }, 500);
            }
        }
    };
    
    // 加载Google CSE脚本
    const script = document.createElement('script');
    script.async = true;
    script.src = 'https://cse.google.com/cse.js?cx=20995defc55444858';
    document.body.appendChild(script);
});
</script>

<style>
.search-placeholder {
    display: flex;
    width: 100%;
    align-items: center;
}

.search-placeholder input {
    flex: 1;
    background: transparent;
    border: none;
    color: white;
    font-size: 1.05rem;
    padding: 0.3rem 0;
    outline: none;
}

.search-placeholder input::placeholder {
    color: rgba(255, 255, 255, 0.85);
    font-weight: 300;
}

.search-placeholder button {
    background: transparent;
    border: none;
    color: white;
    cursor: not-allowed;
    font-size: 1.15rem;
    padding-left: 0.5rem;
}
</style>
