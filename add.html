<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AdSense 数据看板</title>
    <style>
        :root { --primary: #4285f4; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 40px; }
        .card { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #3c4043; margin-bottom: 30px; }
        .btn-group { text-align: center; margin-bottom: 20px; }
        button { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: #3367d6; box-shadow: 0 4px 12px rgba(66,133,244,0.3); }
        #signout_btn { background: #ea4335; margin-left: 10px; display: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; display: none; }
        .metric-box { background: #fff; border: 1px solid #e0e0e0; padding: 20px; border-radius: 12px; text-align: center; }
        .metric-label { font-size: 14px; color: #70757a; margin-bottom: 8px; }
        .metric-value { font-size: 24px; font-weight: bold; color: #1a73e8; }
        #status { text-align: center; margin-top: 10px; font-size: 14px; color: #5f6368; }
    </style>
</head>
<body>

<div class="card">
    <h2>Google AdSense 实时监控</h2>
    
    <div class="btn-group">
        <button id="auth_btn" onclick="handleAuthClick()">授权访问 AdSense</button>
        <button id="signout_btn" onclick="handleSignoutClick()">退出登录</button>
    </div>

    <div id="status">准备就绪，待授权...</div>

    <div class="grid" id="dashboard">
        <div class="metric-box">
            <div class="metric-label">昨日页面浏览量</div>
            <div id="pv" class="metric-value">0</div>
        </div>
        <div class="metric-box">
            <div class="metric-label">昨日预估收益 (USD)</div>
            <div id="earnings" class="metric-value">$0.00</div>
        </div>
        <div class="metric-box">
            <div class="metric-label">广告展示次数</div>
            <div id="imp" class="metric-value">0</div>
        </div>
        <div class="metric-box">
            <div class="metric-label">点击次数</div>
            <div id="clicks" class="metric-value">0</div>
        </div>
    </div>
</div>

<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

<script>
    const CLIENT_ID = '297716650690-qmri2q0a56siuvj8s9eijg08lst069ie.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/adsense.readonly';
    const DISCOVERY_DOC = 'https://adsense.googleapis.com/$discovery/rest?version=v2';

    let tokenClient;
    let gapiInited = false;
    let gsiInited = false;

    function gapiLoaded() {
        gapi.load('client', async () => {
            await gapi.client.init({ discoveryDocs: [DISCOVERY_DOC] });
            gapiInited = true;
            maybeEnableButtons();
        });
    }

    function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,
            callback: '', 
        });
        gsiInited = true;
        maybeEnableButtons();
    }

    function maybeEnableButtons() {
        if (gapiInited && gsiInited) {
            document.getElementById('status').innerText = 'API 已加载，请点击授权。';
        }
    }

    function handleAuthClick() {
        tokenClient.callback = async (resp) => {
            if (resp.error !== undefined) throw (resp);
            document.getElementById('auth_btn').style.display = 'none';
            document.getElementById('signout_btn').style.display = 'inline-block';
            document.getElementById('dashboard').style.display = 'grid';
            document.getElementById('status').innerText = '正在获取数据...';
            await refreshData();
        };

        if (gapi.client.getToken() === null) {
            tokenClient.requestAccessToken({prompt: 'consent'});
        } else {
            tokenClient.requestAccessToken({prompt: ''});
        }
    }

    async function refreshData() {
        try {
            const userAccounts = await gapi.client.adsense.accounts.list();
            if (!userAccounts.result.accounts) {
                document.getElementById('status').innerText = '未找到关联的 AdSense 账号。';
                return;
            }
            const accountId = userAccounts.result.accounts[0].name;
            
            const response = await gapi.client.adsense.accounts.reports.generate({
                account: accountId,
                dateRange: 'YESTERDAY',
                metrics: ['PAGE_VIEWS', 'ESTIMATED_EARNINGS', 'IMPRESSIONS', 'CLICKS'],
            });

            const stats = response.result.totals.cells;
            document.getElementById('pv').innerText = stats[0].value;
            document.getElementById('earnings').innerText = '$' + stats[1].value;
            document.getElementById('imp').innerText = stats[2].value;
            document.getElementById('clicks').innerText = stats[3].value;
            document.getElementById('status').innerText = '最后更新: ' + new Date().toLocaleTimeString();
        } catch (err) {
            document.getElementById('status').innerText = '错误: ' + err.result.error.message;
        }
    }

    function handleSignoutClick() {
        const token = gapi.client.getToken();
        if (token !== null) {
            google.accounts.oauth2.revoke(token.access_token);
            gapi.client.setToken('');
            location.reload();
        }
    }
</script>
</body>
</html>
