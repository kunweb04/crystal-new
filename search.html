<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索 - CrystalLab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="content.css">
    <link rel="icon" href="favicon.ico">
    <style>
        .search-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }
        
        .search-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .search-header h1 {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
            font-family: 'Playfair Display', serif;
        }
        
        .search-form {
            max-width: 600px;
            margin: 0 auto 3rem;
            display: flex;
            gap: 1rem;
        }
        
        .search-form input {
            flex: 1;
            padding: 1rem 1.5rem;
            border: 2px solid var(--border-color);
            border-radius: 50px;
            font-size: 1.1rem;
        }
        
        .search-form button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: var(--transition);
        }
        
        .search-form button:hover {
            background: var(--accent-light);
        }
        
        #google-search-results {
            min-height: 500px;
        }
        
        .gcse-searchresults {
            font-family: 'Noto Sans SC', sans-serif !important;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="search-container">
        <div class="search-header">
            <h1><i class="fas fa-search"></i> 搜索晶体相关内容</h1>
            <p>使用Google自定义搜索引擎查找网站内容</p>
        </div>
        
        <form class="search-form" id="search-form">
            <input type="text" id="search-query" placeholder="输入关键词..." required>
            <button type="submit"><i class="fas fa-search"></i> 搜索</button>
        </form>
        
        <div id="google-search-results">
            <!-- Google CSE 结果将显示在这里 -->
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchForm = document.getElementById('search-form');
            const searchQuery = document.getElementById('search-query');
            
            // 加载Google CSE脚本
            const script = document.createElement('script');
            script.async = true;
            script.src = 'https://cse.google.com/cse.js?cx=20995defc55444858';
            script.onload = function() {
                // 初始化Google CSE
                const gcse = document.createElement('div');
                gcse.className = 'gcse-searchresults-only';
                gcse.setAttribute('data-queryParameterName', 'q');
                document.getElementById('google-search-results').appendChild(gcse);
                
                // 检查URL参数
                const urlParams = new URLSearchParams(window.location.search);
                const query = urlParams.get('q');
                if (query) {
                    searchQuery.value = query;
                    // 触发搜索
                    setTimeout(() => {
                        if (window.google && window.google.search) {
                            window.google.search.cse.element.getElement('standard').execute(query);
                        }
                    }, 1000);
                }
            };
            document.head.appendChild(script);
            
            // 表单提交
            searchForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const query = searchQuery.value.trim();
                if (query) {
                    // 更新URL但不重新加载页面
                    const newUrl = `${window.location.pathname}?q=${encodeURIComponent(query)}`;
                    window.history.pushState({}, '', newUrl);
                    
                    // 触发搜索
                    if (window.google && window.google.search) {
                        window.google.search.cse.element.getElement('standard').execute(query);
                    }
                }
            });
        });
    </script>
</body>
</html>
