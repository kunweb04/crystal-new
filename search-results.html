<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CrystalLab - 搜索结果">
    <title>搜索结果 - CrystalLab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="content.css">
    <link rel="icon" href="favicon.ico" type="image/png">
    <script async src="https://cse.google.com/cse.js?cx=20995defc55444858"></script>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="section">
            <div class="section-title">
                <h2>搜索结果</h2>
                <p>以下是与您的搜索相关的内容</p>
            </div>
            
            <div class="search-results-container">
                <div class="gcse-searchresults-only" id="searchResultsContainer"></div>
                
                <div id="searchLoading" style="display: none; text-align: center; padding: 3rem;">
                    <div style="font-size: 2rem; color: var(--accent); margin-bottom: 1rem;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </div>
                    <p style="color: var(--text-light); font-size: 1.2rem;">正在搜索中...</p>
                </div>
                
                <div id="searchError" style="display: none; text-align: center; padding: 3rem;">
                    <div style="font-size: 2rem; color: #e74c3c; margin-bottom: 1rem;">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <p style="color: var(--text-light); font-size: 1.2rem;">搜索过程中出现错误，请稍后重试</p>
                    <a href="index.html" class="card-btn" style="margin-top: 1rem;">返回首页</a>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="components.js"></script>
    <script>
        // 从URL获取搜索关键词
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // 执行搜索
        function performSearch(query) {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.value = query;
            }
            
            if (window.google && window.google.search && window.google.search.cse) {
                const element = google.search.cse.element.getElement('searchresults-only0');
                if (element) {
                    element.execute(query);
                    document.getElementById('searchLoading').style.display = 'none';
                }
            }
        }

        // 初始化搜索
        document.addEventListener('DOMContentLoaded', function() {
            const query = getQueryParam('q');
            const searchResultsContainer = document.getElementById('searchResultsContainer');
            const searchLoading = document.getElementById('searchLoading');
            
            if (query && searchResultsContainer) {
                searchLoading.style.display = 'block';
                
                // 等待Google CSE加载
                const checkGoogle = setInterval(function() {
                    if (window.google && window.google.search && window.google.search.cse) {
                        clearInterval(checkGoogle);
                        
                        // 设置搜索结果容器
                        searchResultsContainer.innerHTML = '';
                        const searchBox = document.createElement('div');
                        searchBox.className = 'gcse-searchresults-only';
                        searchBox.setAttribute('data-gname', 'searchresults-only');
                        searchResultsContainer.appendChild(searchBox);
                        
                        // 执行搜索
                        setTimeout(() => {
                            performSearch(query);
                        }, 500);
                    }
                }, 100);
                
                // 如果30秒后仍未加载成功，显示错误
                setTimeout(() => {
                    if (searchLoading.style.display === 'block') {
                        searchLoading.style.display = 'none';
                        document.getElementById('searchError').style.display = 'block';
                    }
                }, 30000);
            } else if (!query) {
                window.location.href = 'index.html';
            }
        });

        // 处理搜索表单提交
        document.addEventListener('DOMContentLoaded', function() {
            const searchForm = document.getElementById('searchBox');
            const searchInput = document.getElementById('searchInput');
            const searchButton = document.getElementById('searchButton');
            
            if (searchForm && searchInput && searchButton) {
                function submitSearch() {
                    const query = searchInput.value.trim();
                    if (query) {
                        window.location.href = `search-results.html?q=${encodeURIComponent(query)}`;
                    }
                }
                
                searchButton.addEventListener('click', submitSearch);
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        submitSearch();
                    }
                });
            }
        });
    </script>
</body>
</html>
