<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CrystalLab - 晶体更新投票，参与决定我们下次更新的晶体类型">
    <meta name="keywords" content="晶体投票,晶体培养,晶体化学,硫酸铜,磷酸二氢钾,金属铋">
    <meta name="author" content="CrystalLab团队">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CrystalLab">
    <meta property="og:title" content="晶体更新投票 - CrystalLab">
    <meta property="og:description" content="参与投票，决定我们下次更新的晶体类型！">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:url" content="https://crystal-lab.org/vote.html">
    <meta property="og:image" content="https://crystal-lab.org/og.png">
    <title>晶体更新投票 - CrystalLab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="content.css">
    <link rel="icon" href="favicon.ico" type="image/png">
    <meta name="google-adsense-account" content="ca-pub-9337526323324673">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9337526323324673"
     crossorigin="anonymous"></script>
</head>
<body>
    <div id="navbar-container"></div>

    <section class="hero secondary-hero vote-hero">
        <div class="crystal"><i class="fas fa-diamond"></i></div>
        <div class="crystal"><i class="fas fa-diamond"></i></div>
        <div class="crystal"><i class="fas fa-diamond"></i></div>
        <div class="crystal"><i class="fas fa-diamond"></i></div>
        <div class="crystal"><i class="fas fa-diamond"></i></div>
        <div class="crystal"><i class="fas fa-diamond"></i></div>
        
        <div class="hero-content">
            <h2>决定<span>未来</span>的晶体</h2>
            <p>投票选择您最希望看到的下一期晶体专题，共同塑造 CrystalLab 的内容方向</p>
        </div>
    </section>

    <div class="container">
        <div class="vote-container">
            <div class="vote-content">
                <h1>晶体更新投票</h1>
                <p class="vote-intro">
                    您希望我们接下来详细介绍哪种晶体的培养方法？请从以下候选晶体中选择您最感兴趣的一种。
                    您的投票将直接影响我们下一期专题内容的制作方向！
                </p>

                <div class="vote-grid" id="voteOptions">
                    <!-- 投票选项将通过JavaScript动态加载 -->
                </div>

                <div class="vote-actions">
                    <button id="submitVote" class="submit-vote-btn" disabled>
                        <i class="fas fa-vote-yea"></i>
                        提交投票
                    </button>
                    <div id="voteMessage" class="vote-message"></div>
                </div>

                <div class="vote-results" id="voteResults" style="display: none;">
                    <div class="results-header">
                        <h3>当前投票结果</h3>
                        <div class="total-votes">总投票数: <span id="totalVotes">0</span></div>
                    </div>
                    <div id="resultsContainer">
                        <!-- 结果将通过JavaScript动态加载 -->
                    </div>
                </div>

                <!-- 广告位 -->
                <div class="ad-container article-ad">
                    <ins class="adsbygoogle"
                         style="display:block; text-align:center;"
                         data-ad-layout="in-article"
                         data-ad-format="fluid"
                         data-ad-client="ca-pub-9337526323324673"
                         data-ad-slot="6874868877"></ins>
                    <script>
                         (adsbygoogle = window.adsbygoogle || []).push({});
                    </script>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="components.js"></script>
    <script>
        // 替换为您的 Worker URL
        const WORKER_URL = 'https://crystal-vote-worker.您的子域名.workers.dev';
        
        // 投票选项数据
        const voteOptions = [
            {
                id: 'crystal_1',
                name: '氯化钠晶体',
                description: '探索最常见的盐类晶体，学习如何培养完美的立方体氯化钠晶体，了解其在不同条件下的生长特性。',
                image: 'p/vote-nacl.jpg',
                defaultImage: 'https://via.placeholder.com/400x200/4A90E2/FFFFFF?text=氯化钠晶体'
            },
            {
                id: 'crystal_2', 
                name: '酒石酸钾钠',
                description: '制作具有压电效应的有趣晶体，了解其在电子领域的应用，掌握特殊晶体的培养技巧。',
                image: 'p/vote-tartrate.jpg',
                defaultImage: 'https://via.placeholder.com/400x200/50E3C2/FFFFFF?text=酒石酸钾钠'
            },
            {
                id: 'crystal_3',
                name: '硫酸镁晶体',
                description: '培养美丽的针状硫酸镁晶体，学习快速结晶技巧，了解其在医药和化工中的应用。',
                image: 'p/vote-mgso4.jpg',
                defaultImage: 'https://via.placeholder.com/400x200/9013FE/FFFFFF?text=硫酸镁晶体'
            },
            {
                id: 'crystal_4',
                name: '重铬酸钾',
                description: '制作鲜艳的橙色晶体，了解氧化剂晶体的特殊性质，掌握高危晶体的安全操作方法。',
                image: 'p/vote-dichromate.jpg',
                defaultImage: 'https://via.placeholder.com/400x200/F5A623/FFFFFF?text=重铬酸钾'
            },
            {
                id: 'crystal_5',
                name: '明矾大单晶',
                description: '挑战培养透明完美的明矾大单晶，学习晶体退火和光学级晶体的制作工艺。',
                image: 'p/vote-alum.jpg',
                defaultImage: 'https://via.placeholder.com/400x200/BD10E0/FFFFFF?text=明矾大单晶'
            },
            {
                id: 'crystal_6',
                name: '乙酸铜晶体',
                description: '制作独特的蓝绿色配合物晶体，了解有机酸盐晶体的特殊结构和培养方法。',
                image: 'p/vote-copper-acetate.jpg',
                defaultImage: 'https://via.placeholder.com/400x200/7ED321/FFFFFF?text=乙酸铜晶体'
            }
        ];

        let selectedOption = null;
        let hasVoted = false;

        // 初始化投票页面
        function initializeVotePage() {
            renderVoteOptions();
            loadVoteResults();
            checkVotingStatus();
        }

        // 渲染投票选项
        function renderVoteOptions() {
            const container = document.getElementById('voteOptions');
            container.innerHTML = '';

            voteOptions.forEach(option => {
                const optionElement = document.createElement('div');
                optionElement.className = 'vote-option';
                optionElement.dataset.optionId = option.id;
                
                optionElement.innerHTML = `
                    <div class="crystal-image">
                        <img src="${option.image}" alt="${option.name}" 
                             onerror="this.src='${option.defaultImage}'">
                    </div>
                    <div class="crystal-name">${option.name}</div>
                    <div class="crystal-description">${option.description}</div>
                    <div class="vote-stats">
                        <div class="vote-count">票数: <span id="count_${option.id}">0</span></div>
                        <div class="vote-percentage"><span id="percent_${option.id}">0</span>%</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress_${option.id}"></div>
                    </div>
                `;

                optionElement.addEventListener('click', () => selectOption(option.id));
                container.appendChild(optionElement);
            });
        }

        // 选择投票选项
        function selectOption(optionId) {
            if (hasVoted) return;

            // 取消之前的选择
            if (selectedOption) {
                const prevOption = document.querySelector(`[data-option-id="${selectedOption}"]`);
                if (prevOption) prevOption.classList.remove('selected');
            }

            // 选择新的选项
            selectedOption = optionId;
            const currentOption = document.querySelector(`[data-option-id="${selectedOption}"]`);
            if (currentOption) currentOption.classList.add('selected');

            // 启用提交按钮
            document.getElementById('submitVote').disabled = false;
        }

        // 提交投票
        async function submitVote() {
            if (!selectedOption || hasVoted) return;

            const submitBtn = document.getElementById('submitVote');
            const messageDiv = document.getElementById('voteMessage');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 提交中...';

            try {
                const response = await fetch('crystal-vote-worker.enderwolf9487.workers.dev', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    optionId: selectedOption,
                    voterId: generateVoterId()
                })
            });

                if (result.success) {
                    messageDiv.className = 'vote-message success';
                    messageDiv.innerHTML = '<i class="fas fa-check-circle"></i> 投票成功！感谢您的参与。';
                    hasVoted = true;
                    submitBtn.style.display = 'none';
                    
                    // 记录本地投票状态
                    localStorage.setItem(`voted_${generateVoterId()}`, 'true');
                    
                    // 更新结果显示
                    loadVoteResults();
                } else {
                    throw new Error(result.error || '投票失败');
                }
            } catch (error) {
                messageDiv.className = 'vote-message error';
                messageDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${error.message}`;
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-vote-yea"></i> 提交投票';
            }
        }

        // 加载投票结果
        async function loadVoteResults() {
            try {
                const response = await fetch(`${WORKER_URL}/api/vote/results`);
                const results = await response.json();

                if (results.success) {
                    displayResults(results.data);
                }
            } catch (error) {
                console.error('加载投票结果失败:', error);
            }
        }

        // 显示投票结果
        function displayResults(data) {
            const resultsContainer = document.getElementById('voteResults');
            const totalVotesSpan = document.getElementById('totalVotes');
            const container = document.getElementById('resultsContainer');

            resultsContainer.style.display = 'block';
            totalVotesSpan.textContent = data.totalVotes;

            // 更新每个选项的票数和百分比
            voteOptions.forEach(option => {
                const optionData = data.options[option.id] || { votes: 0, percentage: 0 };
                
                const countElement = document.getElementById(`count_${option.id}`);
                const percentElement = document.getElementById(`percent_${option.id}`);
                const progressElement = document.getElementById(`progress_${option.id}`);

                if (countElement) countElement.textContent = optionData.votes;
                if (percentElement) percentElement.textContent = optionData.percentage.toFixed(1);
                if (progressElement) progressElement.style.width = `${optionData.percentage}%`;
            });

            // 显示详细结果列表
            container.innerHTML = '';
            const sortedOptions = voteOptions.map(option => ({
                ...option,
                ...(data.options[option.id] || { votes: 0, percentage: 0 })
            })).sort((a, b) => b.votes - a.votes);

            sortedOptions.forEach((option, index) => {
                const resultItem = document.createElement('div');
                resultItem.className = 'vote-option';
                resultItem.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <strong>#${index + 1} ${option.name}</strong>
                            <div style="color: var(--text-light); font-size: 0.9rem; margin-top: 0.5rem;">
                                ${option.votes} 票 (${option.percentage.toFixed(1)}%)
                            </div>
                        </div>
                        <div class="progress-bar" style="width: 60%; margin: 0;">
                            <div class="progress-fill" style="width: ${option.percentage}%;"></div>
                        </div>
                    </div>
                `;
                container.appendChild(resultItem);
            });
        }

        // 检查投票状态
        function checkVotingStatus() {
            const voterId = getVoterId();
            if (voterId) {
                hasVoted = localStorage.getItem(`voted_${voterId}`) === 'true';
                if (hasVoted) {
                    document.getElementById('submitVote').style.display = 'none';
                    document.getElementById('voteMessage').className = 'vote-message success';
                    document.getElementById('voteMessage').innerHTML = '<i class="fas fa-info-circle"></i> 您已经投过票了，感谢您的参与！';
                    document.getElementById('voteMessage').style.display = 'block';
                }
            }
        }

        // 生成投票者ID
        function generateVoterId() {
            let voterId = localStorage.getItem('voterId');
            if (!voterId) {
                voterId = 'voter_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('voterId', voterId);
            }
            return voterId;
        }

        function getVoterId() {
            return localStorage.getItem('voterId');
        }

        // 事件监听
        document.getElementById('submitVote').addEventListener('click', submitVote);

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initializeVotePage);
    </script>
</body>
</html>
